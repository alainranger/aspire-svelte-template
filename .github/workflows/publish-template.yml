name: Build and publish template

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templates/AspireSvelte/frontend/package-lock.json

      - name: Determine package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Generate and build sample solution
        shell: bash
        run: |
          output="$RUNNER_TEMP/aspire-svelte-ci"
          dotnet new install ./templates/AspireSvelte
          dotnet new aspire-svelte --name AspireSvelte.CI --output "$output" --no-update-check
          dotnet build "$output/AspireSvelte.CI.sln" --configuration Release
          cd "$output/frontend"
          npm ci
          npm run check
          npm run build

      - name: Pack template
        run: dotnet pack AspireSvelte.Templates.csproj --configuration Release --output ./artifacts -p:Version=${{ steps.version.outputs.value }}

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget push
          "./artifacts/AspireSvelte.Templates.${{ steps.version.outputs.value }}.nupkg"
          --api-key "$GITHUB_TOKEN"
          --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"
          --skip-duplicate
